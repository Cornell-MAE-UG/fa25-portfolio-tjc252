---
layout: default
---

<article class="project">

  <header class="project-header">
    <h1>{{ page.title }}</h1>
  </header>

  {% if page.images %}
  <div class="project-gallery">
    {% for image in page.images %}
      <img src="{{ image | relative_url }}">
    {% endfor %}
  </div>
  {% endif %}

  <div class="project-text">
    {{ content | markdownify }}
  </div>

</article>
